name: Build & Release

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Restrict default permissions — each job declares only what it needs
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # Electron's entry point resolves to the installed binary and downloads
      # it (~100 MB) when missing, and `npm ci --ignore-scripts` below skips
      # that install. Unit tests never launch Electron — they inject fakes —
      # but electron-log requires the module, so point Electron at a path that
      # is never read instead of paying for a download.
      ELECTRON_OVERRIDE_DIST_PATH: /tmp/no-electron

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts blocks arbitrary dependency lifecycle scripts. Nothing
      # here needs them: the project has no native dependencies, and packaging
      # downloads its own Electron.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  linux_x64:
    needs: [lint_and_test]
    runs-on: ubuntu-latest
    permissions:
      # Needed by the release build to upload artifacts to the GitHub release.
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js and NPM
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # electron-builder invokes rpmbuild for the rpm target and does not
      # bundle it. The runner image is not guaranteed to carry it.
      - name: Install rpm tooling
        run: |
          if ! command -v rpmbuild > /dev/null; then
            sudo apt-get update
            sudo apt-get install -y rpm
          fi

      # On main, publish to the GitHub release matching the version in
      # package.json — release-please creates that release when its release PR
      # is merged.
      - name: Build for release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:linux -- --publish always

      - name: Build for PR
        if: github.ref != 'refs/heads/main'
        run: npm run dist:linux -- --publish never

      - name: Upload PR artifacts
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outlook-for-linux-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 30
          compression-level: 6
