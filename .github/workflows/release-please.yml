name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      # Opens (and keeps updating) a "chore: release X.Y.Z" pull request that
      # bumps the version and writes CHANGELOG.md from the conventional commits
      # on main. Merging that PR creates the tag and the GitHub release; the
      # build workflow then attaches the packages to it.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
